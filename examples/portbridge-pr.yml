name: Optional PortBridge prior work
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pull_request_url:
        description: Public GitHub pull request URL
        required: true
        type: string
permissions: {}
concurrency:
  group: portbridge-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  prior-work:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read public prior work
        uses: akimfomin/PortBridge@7642d8288a03d66602db4735b23c1c92071a9ec7
        continue-on-error: true
        with:
          pull-request-url: ${{ inputs.pull_request_url || '' }}
