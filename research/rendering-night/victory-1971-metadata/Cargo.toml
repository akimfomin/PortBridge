[package]
name = "portbridge-victory-metadata"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "metadata"
path = "fixture.rs"

[dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]

[dependencies.windows-sys]
version = "=0.61.2"
features = ["Win32_Foundation", "Win32_System_JobObjects"]
