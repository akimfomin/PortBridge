<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-ru="PortBridge — рабочий штаб">PortBridge working office</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/office.css">
  <script src="/static/office.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#office-title" data-ru="К содержанию">Skip to content</a>
  <header class="office-header">
    <a class="brand" href="/" data-office-catalog aria-label="PortBridge public catalog" data-ru-aria-label="PortBridge, открытый каталог"><span class="brand-mark" aria-hidden="true"></span>PortBridge</a>
    <div class="office-header-nav">
      <a href="/" data-office-catalog data-ru="Открытый каталог">Public catalog</a>
      <nav class="language-switch" aria-label="Language" data-ru-aria-label="Язык">
        <a href="/office" data-office-language="en" lang="en" hreflang="en" aria-current="true">English</a>
        <a href="/office?lang=ru" data-office-language="ru" lang="ru" hreflang="ru">Русский</a>
      </nav>
    </div>
  </header>
  <main class="office">
    <div class="office-intro">
      <div>
        <h1 id="office-title" data-ru="Рабочий штаб">Working office</h1>
        <p data-ru="Общие задачи, проверки и решения команд.">Shared tasks, tests, and team decisions.</p>
      </div>
      <div id="office-account" class="office-actions" hidden>
        <span id="office-viewer"></span>
        <button id="office-refresh" type="button" data-ru="Обновить">Refresh</button>
        <button id="office-logout" type="button" data-ru="Выйти">Sign out</button>
      </div>
    </div>
    <p id="office-status" class="office-status" role="status"></p>
    <form id="office-login" class="office-panel office-login" method="post">
      <label for="office-key" data-ru="Ключ участника">Participant key</label>
      <input id="office-key" type="password" required autocomplete="off" maxlength="128" spellcheck="false">
      <button type="submit" class="office-primary" data-ru="Войти в штаб">Sign in</button>
    </form>
    <section id="office-overview" class="office-panel office-overview" aria-labelledby="office-overview-title" hidden>
      <h2 id="office-overview-title" data-ru="Общий прогресс">Overall progress</h2>
      <div id="office-progress"></div>
    </section>
    <div id="office-board" class="office-grid" hidden>
      <section aria-labelledby="office-plans-title">
        <div class="office-section-head">
          <h2 id="office-plans-title" tabindex="-1" data-ru="План работ">Work plans</h2>
          <div id="office-plan-form"></div>
        </div>
        <div id="office-plans" class="office-list"></div>
      </section>
      <aside class="office-aside" aria-label="Topics and projects" data-ru-aria-label="Темы и проекты">
        <section class="office-panel" aria-labelledby="office-topics-title">
          <h2 id="office-topics-title" data-ru="Темы">Topics</h2>
          <div id="office-subscriptions" class="office-actions"></div>
          <div id="office-topic-forms" class="office-list"></div>
          <form id="office-subscribe" class="office-form">
            <label for="office-topic-id" data-ru="ID темы">Topic ID</label>
            <div class="office-actions">
              <input id="office-topic-id" maxlength="64" placeholder="PB-0001" required>
              <button type="submit" data-ru="Присоединиться">Join</button>
            </div>
          </form>
        </section>
        <section id="office-thread" class="office-panel" aria-labelledby="office-thread-title" hidden>
          <h2 id="office-thread-title" tabindex="-1">Discussion</h2>
          <div id="office-messages" class="office-list"></div>
          <div id="office-thread-form"></div>
        </section>
        <section class="office-panel" aria-labelledby="office-projects-title">
          <h2 id="office-projects-title" data-ru="Новые проекты">New projects</h2>
          <div id="office-project-form"></div>
          <div id="office-projects" class="office-list"></div>
        </section>
      </aside>
    </div>
  </main>
</body>
</html>
