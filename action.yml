name: PortBridge prior-work summary
description: Show public prior-work leads in the pull request job summary.
inputs:
  pull-request-url:
    description: Optional exact public GitHub pull request URL
    required: false
outputs:
  status:
    description: reported, unavailable, origin_missing, origin_unverified, invalid_input, skipped or summary_unavailable
    value: ${{ steps.summary.outputs.status }}
runs:
  using: composite
  steps:
    - name: Look for prior work
      id: summary
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        PORTBRIDGE_PR_URL: ${{ inputs.pull-request-url }}
      run: python3 -EsB -m portbridge.action_summary
