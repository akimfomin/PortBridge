name: PortBridge one-PR pilot

on:
  workflow_dispatch:
    inputs:
      pull_request_url:
        description: Public GitHub pull request URL
        required: true
        type: string

permissions: {}

jobs:
  prior-work:
    if: github.repository == 'akimfomin/PortBridge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Check out PortBridge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Summarize prior work
        uses: ./
