name: PortBridge one-PR pilot

on:
  workflow_dispatch:
    inputs:
      pull_request_url:
        description: Public GitHub pull request URL
        required: true
        type: string
      target_revision:
        description: Optional 40-character receiving SHA in the same public repository
        required: false
        type: string

permissions: {}

jobs:
  prior-work:
    if: github.repository == 'akimfomin/PortBridge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Check out PortBridge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Summarize prior work
        uses: ./
        with:
          pull-request-url: ${{ inputs.pull_request_url }}
      - name: Compare against the pinned receiving revision
        if: inputs.target_revision != ''
        env:
          PORTBRIDGE_PR_URL: ${{ inputs.pull_request_url }}
          PORTBRIDGE_TARGET_SHA: ${{ inputs.target_revision }}
        run: python -B -m portbridge.merge_check
