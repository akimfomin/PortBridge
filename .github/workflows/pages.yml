name: PortBridge static snapshots

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '13,43 * * * *'

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'issue_comment' && !(github.repository == 'akimfomin/PortBridge' && github.event.sender.id == 201861029
        && github.event.comment.user.id == 201861029 && github.event.comment.author_association == 'OWNER'
        && !github.event.issue.pull_request && contains(fromJSON('[4,5,9,54,58,63,84,87,155,159]'), github.event.issue.number)
        && (contains(github.event.comment.body, 'PortBridge test review v1')
          || contains(github.event.changes.body.from, 'PortBridge test review v1')))
      && format('portbridge-pages-ignored-{0}', github.run_id)
      || (github.ref == 'refs/heads/main' && 'portbridge-pages' || format('portbridge-pages-preview-{0}', github.ref)) }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.ref == 'refs/heads/main' && (github.event_name != 'issue_comment'
        || (github.repository == 'akimfomin/PortBridge' && github.event.sender.id == 201861029
        && github.event.comment.user.id == 201861029 && github.event.comment.author_association == 'OWNER'
        && !github.event.issue.pull_request && contains(fromJSON('[4,5,9,54,58,63,84,87,155,159]'), github.event.issue.number)
        && (contains(github.event.comment.body, 'PortBridge test review v1')
          || contains(github.event.changes.body.from, 'PortBridge test review v1'))))) ||
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        && github.head_ref == 'audit/review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      previous_status: ${{ steps.previous.outputs.previous_status }}
      previous_generation: ${{ steps.previous.outputs.previous_generation }}
      site_sha256: ${{ steps.checksums.outputs.site_sha256 }}
      lab_sha256: ${{ steps.checksums.outputs.lab_sha256 }}
      publication_ready: ${{ steps.guard.outputs.ready }}
    steps:
      - name: Check out PortBridge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check the currently published GitHub Pages snapshot
        id: previous
        if: github.repository == 'akimfomin/PortBridge' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && vars.PORTBRIDGE_ENABLE_GITHUB_PAGES == 'true'
        run: python -m portbridge.pages_health probe

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Restore public metadata cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .portbridge/portbridge.sqlite3
          key: ${{ runner.os }}-portbridge-db-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-portbridge-db-v1-

      - name: Read a production-size cache for the release review
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .portbridge/portbridge.sqlite3
          key: ${{ runner.os }}-portbridge-review-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-portbridge-db-v1-

      - name: Recover the latest verified catalog checkpoint if the cache is missing
        if: github.repository == 'akimfomin/PortBridge' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PORTBRIDGE_MIN_CHECKPOINT_COUNT: ${{ steps.previous.outputs.previous_count }}
        run: |
          database=.portbridge/portbridge.sqlite3
          if PORTBRIDGE_CHECKPOINT="$database" python -m portbridge.pages_health checkpoint; then exit 0; fi
          mkdir -p .portbridge/recovery
          runs=$(gh run list --workflow pages.yml --branch main --status success --limit 8 \
            --json databaseId --jq '.[].databaseId') || {
            echo '::warning::Unable to list recovery checkpoints.'
            exit 0
          }
          for run in $runs; do
            candidate=".portbridge/recovery/$run/public.sqlite3"
            if gh run download "$run" --name portbridge-public-catalog-v1 --dir ".portbridge/recovery/$run" \
              && PORTBRIDGE_CHECKPOINT="$candidate" python -m portbridge.pages_health checkpoint \
              && python -m portbridge --db "$candidate" backup --out .portbridge/recovery/verified.sqlite3; then
              if test -e "$database"; then mv -- "$database" .portbridge/recovery/previous.sqlite3; fi
              mv -- .portbridge/recovery/verified.sqlite3 "$database"
              echo "Recovered public catalog from run $run."
              exit 0
            fi
          done
          if test -e "$database" && ! PORTBRIDGE_CHECKPOINT="$database" PORTBRIDGE_MIN_CHECKPOINT_COUNT=0 \
            python -m portbridge.pages_health checkpoint; then
            mv -- "$database" .portbridge/recovery/incomplete.sqlite3
          fi
          echo '::warning::No verified checkpoint available. Publication safeguard will check retained coverage.'

      - name: Refresh Test Lab reports
        env:
          PORTBRIDGE_GITHUB_TOKEN: ${{ github.token }}
        run: python -m portbridge refresh-lab --authenticated

      - name: Refresh public GitHub metadata
        if: github.ref == 'refs/heads/main'
        env:
          PORTBRIDGE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! python -m portbridge sync; then
            echo '::warning::GitHub sync failed. Exporting the reviewed catalog and any retained metadata.'
            python -m portbridge status
          fi

      - name: Continue historical and incremental index
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        env:
          PORTBRIDGE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m portbridge backfill --pages 6
          python -m portbridge incremental --pages 6
          python -m portbridge radar --refresh --discovery --limit 96
          python -m portbridge refresh-people --limit 8

      - name: Verify live source indexing in the manually requested preview
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          PORTBRIDGE_GITHUB_TOKEN: ${{ github.token }}
        run: python -m portbridge.code_search --refresh --require-complete

      - name: Export site and JSON
        run: python -m portbridge export --out dist --repository "$GITHUB_REPOSITORY"

      - name: Verify publication candidate
        run: python -m portbridge.release_gate dist

      - name: Verify retained coverage and database recovery on the review runner
        if: github.event_name == 'pull_request'
        env:
          PORTBRIDGE_MIN_CHECKPOINT_COUNT: ${{ steps.previous.outputs.previous_count }}
        run: |
          test -n "$PORTBRIDGE_MIN_CHECKPOINT_COUNT"
          python -m portbridge backup --public-checkpoint --out .portbridge/rehearsal.sqlite3
          PORTBRIDGE_CHECKPOINT=.portbridge/rehearsal.sqlite3 python -m portbridge.pages_health checkpoint

      - name: Check out the preceding main revision for a rollback rehearsal
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .portbridge/previous-release
          persist-credentials: false

      - name: Rebuild the preceding site with the recovered public catalog
        if: github.event_name == 'pull_request'
        working-directory: .portbridge/previous-release
        run: |
          python -m portbridge --db ../rehearsal.sqlite3 export --out ../rollback-site --repository "$GITHUB_REPOSITORY"
          python "$GITHUB_WORKSPACE/audit/m6_rollback.py" "$GITHUB_WORKSPACE/dist" ../rollback-site

      - name: Archive the read-only review site
        if: github.ref != 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portbridge-review-site
          path: dist
          retention-days: 3
          if-no-files-found: error

      - name: Protect the previous public snapshot
        if: github.repository == 'akimfomin/PortBridge' && github.ref == 'refs/heads/main' && vars.PORTBRIDGE_ENABLE_GITHUB_PAGES == 'true'
        id: guard
        env:
          PORTBRIDGE_PREVIOUS_COUNT: ${{ steps.previous.outputs.previous_count }}
        run: python -m portbridge.pages_health guard

      - name: Prepare public catalog checkpoint
        if: github.repository == 'akimfomin/PortBridge' && github.ref == 'refs/heads/main' && steps.guard.outputs.ready != 'false'
        env:
          PORTBRIDGE_CHECKPOINT: .portbridge/portbridge.sqlite3
        run: |
          python -m portbridge.pages_health checkpoint
          python -m portbridge backup --public-checkpoint --out .portbridge/public.sqlite3

      - name: Retain public catalog checkpoint separately from the cache
        if: github.repository == 'akimfomin/PortBridge' && github.ref == 'refs/heads/main' && steps.guard.outputs.ready != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portbridge-public-catalog-v1
          path: .portbridge/public.sqlite3
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Summarize source age and observed schedule delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REPOSITORY" = "akimfomin/PortBridge" ]; then
            gh run list --workflow pages.yml --event schedule --branch main --limit 8 \
              --json createdAt,conclusion > .portbridge/scheduled-runs.json || true
          fi
          python -m portbridge.pages_health ops

      - name: Record the exported JSON checksums
        id: checksums
        run: python -m portbridge.pages_health record

      - name: Show exported activity and Test Lab freshness
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from collections import Counter
          from pathlib import Path

          activity = json.loads(Path("dist/data/activity.json").read_text(encoding="utf-8"))
          print("## Public activity snapshot")
          print(f"- Trigger: {os.environ['GITHUB_EVENT_NAME']}")
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              print("- Mode: branch validation without publishing")
          print(f"- Last source refresh attempt: {activity['refreshed_at'] or 'unavailable'}")
          print(f"- Source health: {activity['health']}")
          print(f"- Tracked projects: {len(activity['projects'])}")
          print(f"- Events in the feed: {len(activity['events'])}")
          print(f"- Shared checks suggested: {len(activity['opportunities'])}")

          lab = json.loads(Path("dist/data/lab.json").read_text(encoding="utf-8"))
          checks = [task["report_sync"] for task in lab["tasks"] if "report_sync" in task]
          sources = [source for check in checks for source in check["sources"]]
          attempts = [source["attempted_at"] for source in sources if source["attempted_at"]]
          successes = [source["checked_at"] for source in sources if source["checked_at"]]
          print("\n## Test Lab report refresh")
          print(f"- Tasks with report checks: {len(checks)}")
          for state, count in sorted(Counter(check["state"] for check in checks).items()):
              print(f"- {state}: {count}")
          print(f"- Reports shown: {sum(len(check['reports']) for check in checks)}")
          print(f"- Latest report check attempt: {max(attempts, default='unavailable')}")
          print(f"- Oldest successful report check: {min(successes, default='unavailable')}")
          print(f"- Source checks with a successful scan: {len(successes)}/{len(sources)}")
          PY

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && vars.PORTBRIDGE_ENABLE_GITHUB_PAGES == 'true' && steps.guard.outputs.ready != 'false'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

      - name: Upload Cloudflare Pages artifact
        if: github.ref == 'refs/heads/main' && vars.PORTBRIDGE_ENABLE_CLOUDFLARE_PAGES == 'true' && vars.PORTBRIDGE_CLOUDFLARE_PROJECT != '' && steps.guard.outputs.ready != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portbridge-cloudflare-site
          path: dist
          retention-days: 1
          if-no-files-found: error

  github-pages:
    if: github.ref == 'refs/heads/main' && vars.PORTBRIDGE_ENABLE_GITHUB_PAGES == 'true' && needs.build.outputs.publication_ready != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-github-pages:
    if: github.repository == 'akimfomin/PortBridge'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [build, github-pages]
    permissions:
      contents: read
    steps:
      - name: Check out the released verification code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify the public site and Test Lab JSON
        env:
          EXPECTED_SITE_SHA256: ${{ needs.build.outputs.site_sha256 }}
          EXPECTED_LAB_SHA256: ${{ needs.build.outputs.lab_sha256 }}
          PREVIOUS_STATUS: ${{ needs.build.outputs.previous_status }}
          PREVIOUS_GENERATION: ${{ needs.build.outputs.previous_generation }}
        run: python3 -m portbridge.pages_health verify

      - name: Record independently verified publications for the autonomy observation
        if: github.event_name == 'schedule'
        env:
          SITE_SHA256: ${{ needs.build.outputs.site_sha256 }}
          LAB_SHA256: ${{ needs.build.outputs.lab_sha256 }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          receipt = {key: os.environ[key] for key in ("GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "SITE_SHA256", "LAB_SHA256")}
          receipt["verified_at"] = datetime.now(timezone.utc).isoformat(timespec="seconds")
          Path("publication-receipt.json").write_text(json.dumps(receipt) + "\n", encoding="utf-8")
          PY

      - name: Retain the dated verification receipt
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portbridge-scheduled-publication-v1
          path: publication-receipt.json
          retention-days: 30
          if-no-files-found: error

  cloudflare-pages:
    if: github.ref == 'refs/heads/main' && vars.PORTBRIDGE_ENABLE_CLOUDFLARE_PAGES == 'true' && vars.PORTBRIDGE_CLOUDFLARE_PROJECT != '' && needs.build.outputs.publication_ready != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: build
    permissions: {}
    steps:
      - name: Check Cloudflare Pages configuration
        id: config
        env:
          PAGES_PROJECT: ${{ vars.PORTBRIDGE_CLOUDFLARE_PROJECT }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CF_ACCOUNT_ID" || -z "$CF_API_TOKEN" ]]; then
            echo '::notice::Cloudflare Pages credentials are not configured. Skipping deployment.'
            exit 0
          fi
          if [[ ! "$PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]; then
            echo '::error::Invalid PORTBRIDGE_CLOUDFLARE_PROJECT name.'
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download generated site
        if: steps.config.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: portbridge-cloudflare-site
          path: dist

      - name: Set up Node for Wrangler
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Deploy to Cloudflare Pages
        if: steps.config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.167.0'
          command: pages deploy dist --project-name=${{ vars.PORTBRIDGE_CLOUDFLARE_PROJECT }} --branch=main
