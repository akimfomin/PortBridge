name: PortBridge static snapshots

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'

permissions: {}

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'portbridge-pages' || format('portbridge-pages-preview-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out PortBridge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Restore public metadata cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .portbridge/portbridge.sqlite3
          key: ${{ runner.os }}-portbridge-db-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-portbridge-db-v1-

      - name: Refresh Test Lab reports
        run: python -m portbridge refresh-lab

      - name: Refresh public GitHub metadata
        if: github.ref == 'refs/heads/main'
        env:
          PORTBRIDGE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! python -m portbridge sync; then
            echo '::warning::GitHub sync failed. Exporting the reviewed catalog and any retained metadata.'
            python -m portbridge status
          fi

      - name: Continue historical and incremental index
        if: github.ref == 'refs/heads/main'
        env:
          PORTBRIDGE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m portbridge backfill --pages 6
          python -m portbridge incremental --pages 6

      - name: Export site and JSON
        run: python -m portbridge export --out dist --repository "$GITHUB_REPOSITORY"

      - name: Show exported activity and Test Lab freshness
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from collections import Counter
          from pathlib import Path

          activity = json.loads(Path("dist/data/activity.json").read_text(encoding="utf-8"))
          print("## Public activity snapshot")
          print(f"- Trigger: {os.environ['GITHUB_EVENT_NAME']}")
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              print("- Mode: branch validation without publishing")
          print(f"- Last source refresh attempt: {activity['refreshed_at'] or 'unavailable'}")
          print(f"- Source health: {activity['health']}")
          print(f"- Tracked projects: {len(activity['projects'])}")
          print(f"- Events in the feed: {len(activity['events'])}")
          print(f"- Shared checks suggested: {len(activity['opportunities'])}")

          lab = json.loads(Path("dist/data/lab.json").read_text(encoding="utf-8"))
          checks = [task["report_sync"] for task in lab["tasks"] if "report_sync" in task]
          attempts = [check["attempted_at"] for check in checks if check["attempted_at"]]
          successes = [check["checked_at"] for check in checks if check["checked_at"]]
          print("\n## Test Lab report refresh")
          print(f"- Tasks with report checks: {len(checks)}")
          for state, count in sorted(Counter(check["state"] for check in checks).items()):
              print(f"- {state}: {count}")
          print(f"- Reports shown: {sum(len(check['reports']) for check in checks)}")
          print(f"- Latest report check attempt: {max(attempts, default='unavailable')}")
          print(f"- Latest successful report check: {max(successes, default='unavailable')}")
          PY

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && vars.PORTBRIDGE_ENABLE_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

      - name: Upload Cloudflare Pages artifact
        if: github.ref == 'refs/heads/main' && vars.PORTBRIDGE_ENABLE_CLOUDFLARE_PAGES == 'true' && vars.PORTBRIDGE_CLOUDFLARE_PROJECT != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portbridge-cloudflare-site
          path: dist
          retention-days: 1
          if-no-files-found: error

  github-pages:
    if: github.ref == 'refs/heads/main' && vars.PORTBRIDGE_ENABLE_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  cloudflare-pages:
    if: github.ref == 'refs/heads/main' && vars.PORTBRIDGE_ENABLE_CLOUDFLARE_PAGES == 'true' && vars.PORTBRIDGE_CLOUDFLARE_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: build
    permissions: {}
    steps:
      - name: Check Cloudflare Pages configuration
        id: config
        env:
          PAGES_PROJECT: ${{ vars.PORTBRIDGE_CLOUDFLARE_PROJECT }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CF_ACCOUNT_ID" || -z "$CF_API_TOKEN" ]]; then
            echo '::notice::Cloudflare Pages credentials are not configured. Skipping deployment.'
            exit 0
          fi
          if [[ ! "$PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]; then
            echo '::error::Invalid PORTBRIDGE_CLOUDFLARE_PROJECT name.'
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download generated site
        if: steps.config.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: portbridge-cloudflare-site
          path: dist

      - name: Set up Node for Wrangler
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Deploy to Cloudflare Pages
        if: steps.config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.167.0'
          command: pages deploy dist --project-name=${{ vars.PORTBRIDGE_CLOUDFLARE_PROJECT }} --branch=main
