name: PortBridge report intake

on:
  issue_comment:
    types: [created, edited, deleted]

permissions: {}

jobs:
  receipt:
    # The listed issues come from the reviewed task cards; test_lab_intake checks the mapping.
    if: >-
      github.repository == 'akimfomin/PortBridge' && github.ref == 'refs/heads/main'
      && !github.event.issue.pull_request && github.event.comment.user.type == 'User'
      && contains(fromJSON('[4,5,9,54,58]'), github.event.issue.number)
      && ((contains(github.event.comment.body, ':') && contains(github.event.comment.body, '='))
          || (contains(github.event.changes.body.from, ':') && contains(github.event.changes.body.from, '='))
          || (github.event.comment.author_association == 'OWNER'
              && (contains(github.event.comment.body, 'portbridge test review v1')
                  || contains(github.event.changes.body.from, 'portbridge test review v1'))))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    concurrency:
      group: portbridge-report-intake-${{ github.event.comment.id }}
      cancel-in-progress: false
    steps:
      - name: Check out the default branch revision for this event
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate the event against reviewed task cards
        id: classify
        run: python3 -m portbridge.lab_intake

      - name: Keep the scoped intake receipt
        if: steps.classify.outputs.recognized == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portbridge-report-receipt
          path: report-intake.json
          retention-days: 7
          if-no-files-found: error
